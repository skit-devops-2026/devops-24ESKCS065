<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlaceTrack - Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
<h1 class="logo">PlaceTrack</h1>
<div class="auth-box">
<h2>Create account</h2><p class="auth-text">Create your placement preparation profile.</p>
<form id="signupForm">
<label>Full Name</label><input id="signupName" type="text" placeholder="Enter your name" required>
<label>Email</label><input id="signupEmail" type="email" placeholder="Enter your email" required>
<label>Password</label><input id="signupPassword" type="password" placeholder="Create password" required>
<label>Graduation Year</label><select><option>2027</option><option>2028</option><option>2029</option></select>
<button class="primary-btn full-btn" type="submit">Create Account</button>
</form>
<p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
</div></div>
<script src="js/script.js"></script>
</body></html>
