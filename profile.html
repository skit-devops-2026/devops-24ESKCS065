<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceTrack - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <h1 class="logo">PlaceTrack</h1>
        <p class="menu-title">Menu</p>
        <a href="index.html" class="menu-link">Dashboard</a>
        <a href="dsa.html" class="menu-link">DSA Tracker</a>
        <a href="subjects.html" class="menu-link">Subjects</a>
        <a href="goals.html" class="menu-link">Goals</a>
        <a href="profile.html" class="menu-link active">Profile</a>
        <button onclick="logout()" class="logout">Logout</button>
    </aside>

    <div class="main-area">
        <header class="header">
            <div><h2>Profile</h2><p>Your placement information</p></div>
            <span>Deva</span>
        </header>

        <main class="content">

            <div class="page-heading">
                <h1>My Profile</h1>
                <p>Update your basic information.</p>
            </div>

            <section class="simple-card profile-card">

                <div class="profile-header">
                    <div class="profile-avatar">D</div>
                    <div>
                        <h2>Deva</h2>
                        <p>Computer Science Student</p>
                    </div>
                </div>

                <div class="form-grid">

                    <div>
                        <label>Full Name</label>
                        <input class="input" value="Deva">
                    </div>

                    <div>
                        <label>Email</label>
                        <input class="input" value="deva@example.com">
                    </div>

                    <div>
                        <label>College</label>
                        <input class="input" placeholder="Your college">
                    </div>

                    <div>
                        <label>Branch</label>
                        <input class="input" value="Computer Science">
                    </div>

                    <div>
                        <label>Graduation Year</label>
                        <input class="input" value="2027">
                    </div>

                    <div>
                        <label>Target Role</label>
                        <input class="input" value="Software Developer">
                    </div>

                </div>

                <button id="saveProfile" class="primary-btn save-btn">Save Changes</button>
                <span id="profileMessage"></span>

            </section>

        </main>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
