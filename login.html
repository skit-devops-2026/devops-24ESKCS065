<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlaceTrack - Login</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
<h1 class="logo">PlaceTrack</h1>
<div class="auth-box">
<h2>Welcome back</h2><p class="auth-text">Login to continue your placement preparation.</p>
<form id="loginForm">
<label>Email</label><input id="loginEmail" type="email" placeholder="Enter your email" required>
<label>Password</label><input id="loginPassword" type="password" placeholder="Enter your password" required>
<button class="primary-btn full-btn" type="submit">Login</button>
</form>
<button onclick="demoLogin()" class="secondary-btn">Continue as Demo User</button>
<p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
</div></div>
<script src="js/script.js"></script>
</body></html>
